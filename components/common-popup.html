
<!-- Rashtra Setu: Common Popup -->
<div
  id="commonPopupOverlay"
  class="common-popup-overlay"
  aria-hidden="true"
>
  <section
    class="common-popup-box"
    role="dialog"
    aria-modal="true"
    aria-labelledby="commonPopupTitle"
  >
    <button
      type="button"
      id="commonPopupClose"
      class="common-popup-close"
      aria-label="पॉपअप बंद करें"
    >×</button>

    <!-- ऊपर विज्ञापन के लिए जगह -->
    <div
      class="common-popup-ad common-popup-ad-top"
      aria-label="ऊपर विज्ञापन के लिए स्थान"
    ></div>

    <h2 id="commonPopupTitle">विषय की जानकारी</h2>

    <div
      id="commonPopupContent"
      class="common-popup-content"
      aria-live="polite"
    ></div>

    <!-- नीचे विज्ञापन के लिए जगह -->
    <div
      class="common-popup-ad common-popup-ad-bottom"
      aria-label="नीचे विज्ञापन के लिए स्थान"
    ></div>
  </section>
</div>
